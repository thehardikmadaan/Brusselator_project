stages:
  - docker-build
  - build
  - test

# Docker build stage: builds the container image and pushes to GitLab registry
docker-build-job:
  stage: docker-build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:latest

# Build stage: compiles the code and stores the binaries
build-job:
  stage: build
  image: $CI_REGISTRY_IMAGE:latest
  script:
    - mkdir -p build && cd build
    - cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=.. ..
    - make -j$(nproc)
    - make install
  artifacts:
    paths:
      - bin/

# Test stage: runs unit tests and automated variations
test-job:
  stage: test
  image: $CI_REGISTRY_IMAGE:latest
  script:
    # Run the automated unit test suite
    - ./bin/test_solver
    # Verify that the parameter variation script runs successfully
    - chmod +x scripts/run_variation.sh
    - ./scripts/run_variation.sh var2
    # Verify the generated start_run.sh matches the reference
    - diff results/var2/run_0.01/start_run.sh tests/reference_start_run.sh
  dependencies:
    - build-job
